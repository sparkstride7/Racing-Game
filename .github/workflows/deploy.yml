# Builds the game and publishes it to GitHub Pages every time code is pushed,
# so the latest version can be played at https://<owner>.github.io/<repo>/
name: Publish game to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch: # allows a manual run from the "Actions" tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer push replaces an older one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
